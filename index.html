<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Left history archive — starter</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="topbar">
  <h1>Left history archive</h1>
  <span class="catalog-id">pilot dataset — Tebhaga &amp; Nachole, 1938–1950</span>
  <div class="view-tabs">
    <button class="view-tab active" data-view="map">Map</button>
    <button class="view-tab" data-view="timeline">Timeline</button>
  </div>
</div>

<div class="layout">
  <aside class="ledger">
    <div class="filter-section" id="typeSection">
      <button class="filter-header" data-target="typePanel"><span>Entity type</span><span class="caret">⌄</span></button>
      <div class="filter-panel" id="typePanel">
        <fieldset>
          <label><input type="checkbox" id="filter-movements" checked> Movements</label>
          <label><input type="checkbox" id="filter-events" checked> Events</label>
        </fieldset>
      </div>
    </div>

    <div class="filter-section" id="yearSection">
      <button class="filter-header" data-target="yearPanel"><span>Up to year</span><span class="caret">⌄</span></button>
      <div class="filter-panel" id="yearPanel">
        <fieldset>
          <input type="range" id="decade" min="1938" max="1950" step="1" value="1950">
          <div class="decade-readout" id="decade-readout">up to 1950</div>
        </fieldset>
      </div>
    </div>

    <div class="filter-section" id="regionSection">
      <button class="filter-header" data-target="regionPanel"><span>Region</span><span class="caret">⌄</span></button>
      <div class="filter-panel" id="regionPanel">
        <fieldset>
          <select id="region">
            <option value="all">All</option>
            <option value="bengal_india">Bengal / West Bengal, India</option>
            <option value="east_pakistan">East Bengal / Pakistan</option>
          </select>
        </fieldset>
      </div>
    </div>
  </aside>

  <main class="stage">
    <div id="map"></div>
    <div id="timeline" style="display:none"></div>
    <div class="card" id="card"></div>
  </main>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
